<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday RSVP</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <header class="text-center mb-4">
    <h1>Birthday RSVP</h1>
  </header>

  <section id="form-section" class="mb-4">
    <h2>Contact Information</h2>
    <form id="rsvp-form" class="row g-3" novalidate>
      <div class="col-md-6">
        <label for="first-name" class="form-label">First Name:</label>
        <input type="text" class="form-control" id="first-name" required>
      </div>

      <div class="col-md-6">
        <label for="last-name" class="form-label">Last Name:</label>
        <input type="text" class="form-control" id="last-name" required>
      </div>

      <div class="col-md-6">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="col-md-6">
        <label for="phone" class="form-label">Phone Number:</label>
        <input type="tel" class="form-control" id="phone" required>
      </div>

      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-success">Submit RSVP</button>
        <button type="button" id="show-count" class="btn btn-info">Total Confirmed Guests</button>
      </div>
      <p id="form-error" class="text-danger mt-2"></p>
    </form>
  </section>

  <section id="list-section">
    <h2>Submitted RSVPs</h2>
    <div id="rsvp-list" class="list-group mb-2"></div>
  </section>

  <!-- Bootstrap JS Bundle -->
  <!-- Adding the Sweet Alert Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="rsvp.js"></script>
</body>
</html>
